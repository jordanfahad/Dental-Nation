name: Booking widget health

# Availability is checked against the Practo slots API directly (vendor
# recommendation): slots → healthy, empty list → genuine no-availability,
# HTTP error/timeout → outage. No browser, no DOM fragility, no side effects.
# Until the SLOTS_API_KEY secret is configured the job falls back to the old
# robot-patient browser check so monitoring never goes dark.
on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes (UTC)
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

# Never let two checks overlap; a slow run should be skipped, not queued.
concurrency:
  group: widget-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HAS_SLOTS_KEY: ${{ secrets.SLOTS_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Availability check (slots API)
        if: env.HAS_SLOTS_KEY == 'true'
        env:
          SLOTS_API_KEY: ${{ secrets.SLOTS_API_KEY }}
          # "center:resource" pairs; override via repo variable when doctors change.
          SLOTS_RESOURCES: ${{ vars.SLOTS_RESOURCES || '1:DOC0001,1:DOC0017' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.dentalnation.com/en/' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WIDGET_HEALTH_SECRET: ${{ secrets.WIDGET_HEALTH_SECRET }}
        run: node scripts/slots-check.mjs

      # ── Legacy robot-patient fallback (only while SLOTS_API_KEY is unset) ──
      - name: Install Playwright (fallback only)
        if: env.HAS_SLOTS_KEY != 'true'
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Run the robot-patient check (fallback only)
        if: env.HAS_SLOTS_KEY != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.dentalnation.com/en/' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WIDGET_HEALTH_SECRET: ${{ secrets.WIDGET_HEALTH_SECRET }}
        run: node scripts/widget-check.mjs

      # What the robot actually saw, when it saw a problem.
      - name: Upload failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-failure-${{ github.run_id }}
          path: widget-failure.png
          if-no-files-found: ignore
          retention-days: 14
