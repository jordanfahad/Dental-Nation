name: Booking widget health

# MANUAL FALLBACK ONLY. The primary availability monitor runs inside the
# dashboard's 15-minute Vercel cron (/api/cron/sync → lib/ops/slotsMonitor.ts),
# using the PRACTO_AUTH credential already configured there — the vendor
# confirmed the request_handler_key is a short-lived session token minted by a
# login call, so no static-key secret can work and none is needed.
#
# This workflow stays for on-demand checks from the Actions tab:
#   - with the SLOTS_API_AUTH secret ("user:password" for x-insta-auth) set,
#     it runs the two-step slots-API check;
#   - without it, it falls back to the old robot-patient browser check.
on:
  workflow_dispatch: {} # on demand from the Actions tab; no schedule — the app cron is primary

# Never let two checks overlap.
concurrency:
  group: widget-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HAS_SLOTS_AUTH: ${{ secrets.SLOTS_API_AUTH != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Availability check (slots API, login + read)
        if: env.HAS_SLOTS_AUTH == 'true'
        env:
          SLOTS_API_AUTH: ${{ secrets.SLOTS_API_AUTH }}
          # "center:resource" pairs; override via repo variable when doctors change.
          SLOTS_RESOURCES: ${{ vars.SLOTS_RESOURCES || '1:DOC0001,1:DOC0017' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.dentalnation.com/en/' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WIDGET_HEALTH_SECRET: ${{ secrets.WIDGET_HEALTH_SECRET }}
        run: node scripts/slots-check.mjs

      # ── Legacy robot-patient fallback (only while SLOTS_API_AUTH is unset) ──
      - name: Install Playwright (fallback only)
        if: env.HAS_SLOTS_AUTH != 'true'
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Run the robot-patient check (fallback only)
        if: env.HAS_SLOTS_AUTH != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.dentalnation.com/en/' }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WIDGET_HEALTH_SECRET: ${{ secrets.WIDGET_HEALTH_SECRET }}
        run: node scripts/widget-check.mjs

      # What the robot actually saw, when it saw a problem.
      - name: Upload failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-failure-${{ github.run_id }}
          path: widget-failure.png
          if-no-files-found: ignore
          retention-days: 14
