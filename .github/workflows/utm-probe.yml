name: Google Ads tracking probe (one-off)

# Manual only — a diagnostic that answers one question: does a gclid/UTM-tagged
# visit leave any trace the booking widget forwards? Read-only; it never clicks
# "Continue Booking", so it cannot create appointments or leads.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Probe the live site with a tagged visit
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.dentalnation.com/en/' }}
        run: node scripts/utm-probe.mjs

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utm-probe
          path: probe/
          retention-days: 7
